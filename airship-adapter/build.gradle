plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}

group = 'com.gimbal.android'
description = "Use Gimbal Place triggers to track location-based Airship CustomEvents"
version = rootProject.adapterVersion

android {
    namespace = 'com.gimbal.android'

    compileSdkVersion rootProject.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.minSdkVersion as Integer
        targetSdkVersion rootProject.targetSdkVersion as Integer
        aarMetadata {
            minCompileSdk = 28
        }
    }

    buildTypes {
        release {}
        debug {}
    }

    lint {
        // This adapter library legitimately needs to call Airship SDK APIs
        // from a different library group (com.gimbal.android calling com.urbanairship.android)
        // This is the expected behavior for an adapter/bridge library
        disable 'RestrictedApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    api "com.gimbal.android.v4:gimbal-sdk:${rootProject.gimbalVersion}"
    implementation "com.gimbal.android.v4:gimbal-slf4j-impl:${rootProject.gimbalVersion}"
    compileOnly "com.urbanairship.android:urbanairship-core:${rootProject.airshipVersion}"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    implementation "androidx.startup:startup-runtime:1.1.1"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.gimbal.android'
                artifactId = 'airship-adapter'
                version = rootProject.adapterVersion

                pom {
                    name.set("Gimbal Airship Adapter")
                    description.set(project.description)
                    url.set("https://github.com/PaeDae/android-airship-adapter")

                    licenses {
                        license {
                            name.set("The Apache Software License, Version 2.0")
                            url.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
                            distribution.set("repo")
                        }
                    }

                    developers {
                        developer {
                            name.set("Gimbal Developers")
                            email.set("developers@gimbal.com")
                            organization.set("Infillion")
                            organizationUrl.set("https://infillion.com")
                        }
                    }

                    contributors {
                        contributor {
                            name.set("Urban Airship")
                        }
                    }

                    scm {
                        connection.set("scm:git:https://github.com/PaeDae/android-airship-adapter.git")
                        developerConnection.set("scm:git:git@github.com/PaeDae/android-airship-adapter.git")
                        url.set("https://github.com/PaeDae/android-airship-adapter")
                    }
                }
            }
        }

        repositories {
            maven {
                name = "Central"
                url = uri("https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/")
                credentials {
                    username = findProperty("centralUsername")
                    password = findProperty("centralPassword")
                }
            }
        }
    }

    signing {
        sign publishing.publications.release
    }
}

